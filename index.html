<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barbell">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e0f">
<title>Barbell</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f;--surface:#1a1a1c;--border:#2a2a2d;
  --text:#ededec;--muted:#a0a0a0;--subtle:#6e6e70;
  --accent:#6c83ff;--on-accent:#0e0e0f;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --g:20px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;--s9:48px;
  --ease-out:cubic-bezier(0,0,.58,1);--ease-ios:cubic-bezier(.32,.72,0,1);
  --d1:100ms;--d2:200ms;--d3:350ms;--d4:500ms;--tabh:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:22px;
 letter-spacing:-.013em;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;user-select:none;
 display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
 border-radius:10px;padding:var(--s3);width:100%;min-height:44px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-weight:500}
.app{width:100%;max-width:412px;height:100%;max-height:920px;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:520px)and(min-height:940px){.app{border:1px solid var(--border);border-radius:40px}}
.eyebrow{font-size:13px;line-height:18px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.h-lg{font-size:34px;line-height:41px;font-weight:600;letter-spacing:-.02em}
.h-md{font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.018em}
.sub{font-size:13px;line-height:18px;color:var(--muted)}
.meta{font-size:13px;line-height:18px;color:var(--subtle)}
.page{position:absolute;inset:0 0 var(--tabh) 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:calc(var(--safe-t) + var(--s7)) var(--g) calc(var(--safe-b) + var(--s9));display:none}
.page.on{display:block}
.sect{font-size:13px;line-height:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);
 font-weight:500;padding-bottom:var(--s3);border-bottom:1px solid var(--border);margin:var(--s8) 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s4) 0;
 border-bottom:1px solid var(--border);width:100%;min-height:44px}
.row .l{flex:1;min-width:0}
.row .l .t{font-size:17px;line-height:22px}
.row .l .s{font-size:13px;line-height:18px;color:var(--subtle);margin-top:2px}
.row .r{flex-shrink:0;color:var(--muted);font-size:17px;text-align:right}
.row .r .n{color:var(--text)}
.row .r .d{font-size:13px;color:var(--subtle);margin-top:2px}
.chev{color:var(--subtle);margin-left:var(--s2)}
.card{border:1px solid var(--border);border-radius:16px;padding:var(--s6);margin-top:var(--s5)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4)}
.plist{margin:var(--s5) 0 var(--s6)}
.plist div{display:flex;align-items:baseline;justify-content:space-between;padding:var(--s2) 0;
 font-size:15px;line-height:20px;color:var(--muted)}
.plist div .n{color:var(--text);font-size:15px}
.btn{width:100%;height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);
 font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;
 transition:transform var(--d1) var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.quiet{background:none;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn.danger{background:none;border:1px solid var(--border);color:var(--muted);font-weight:500;height:48px}
.week{display:flex;gap:6px;margin-top:var(--s5)}
.day{flex:1;text-align:center}
.day .bar{height:44px;border-radius:3px;background:var(--border);position:relative;overflow:hidden}
.day .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--muted);border-radius:3px}
.day.tdy .bar i{background:var(--text)}
.day .lb{font-size:11px;line-height:13px;color:var(--subtle);margin-top:var(--s2)}
.day.tdy .lb{color:var(--text)}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--safe-b));
 padding-bottom:var(--safe-b);background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 color:var(--subtle);transition:color var(--d1)}
nav button.on{color:var(--text)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:10px;line-height:12px;font-weight:500}
.runner{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
 transform:translateY(100%);transition:transform var(--d4) var(--ease-ios)}
.runner.on{transform:translateY(0)}
.rhead{padding:calc(var(--safe-t) + var(--s5)) var(--g) 0;display:flex;align-items:baseline;
 justify-content:space-between;gap:var(--s4);flex-shrink:0}
.rex{padding:var(--s6) var(--g) 0;flex-shrink:0}
.rex h1{font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.018em}
.rex .where{font-size:13px;line-height:18px;color:var(--muted);margin-top:var(--s1)}
.ticks{display:flex;gap:var(--s2);margin-top:var(--s5);align-items:center}
.tick{height:2px;width:22px;background:var(--border);border-radius:1px;transition:background var(--d2)}
.tick.done{background:var(--text)}.tick.now{background:var(--muted)}.tick.miss{background:var(--subtle)}
.ticklbl{font-size:13px;color:var(--subtle);margin-left:var(--s2)}
.ticklbl .n{font-size:13px;font-weight:400}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:var(--s5) var(--g);
 min-height:0;gap:var(--s3)}
.figure{display:flex;align-items:flex-start;gap:var(--s3);
 transition:opacity var(--d3) var(--ease-ios),transform var(--d3) var(--ease-ios)}
.figure.swap{opacity:0;transform:translateY(12px)}
.figure .v{font-size:80px;line-height:.92;letter-spacing:-.02em}
.figure .u{font-size:20px;line-height:25px;color:var(--subtle);font-weight:400;transform:translateY(12px)}
.target{font-size:17px;color:var(--muted)}.target .n{font-size:17px;color:var(--text)}
.note{font-size:13px;line-height:18px;color:var(--subtle)}
.loadline{font-family:var(--mono);font-size:13px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.lastline{border-top:1px solid var(--border);padding-top:var(--s3);margin-top:var(--s2);font-size:13px;
 line-height:18px;color:var(--subtle);display:flex;gap:var(--s4)}
.lastline .n{font-size:13px;color:var(--muted);font-weight:400}
.rctl{padding:0 var(--g) calc(var(--safe-b) + var(--s5));flex-shrink:0}
.nudge{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--s4);
 border-bottom:1px solid var(--border);margin-bottom:var(--s4)}
.nudge button{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
 font-family:var(--mono);font-size:17px;color:var(--muted);transition:color var(--d1),transform var(--d1)}
.nudge button:active{color:var(--text);transform:scale(.97)}
.nudge .inc{font-size:13px;color:var(--subtle);letter-spacing:.02em}
.secondary{display:flex;justify-content:space-between;margin-top:var(--s4)}
.secondary button{font-size:17px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.secondary button:active{color:var(--text)}
.upnextline{font-size:13px;line-height:18px;color:var(--subtle);margin-top:var(--s4);
 padding-top:var(--s4);border-top:1px solid var(--border)}
.rest{position:absolute;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;
 padding:calc(var(--safe-t) + var(--s5)) var(--g) calc(var(--safe-b) + var(--s5));
 transform:translateY(100%);transition:transform var(--d4) var(--ease-ios)}
.rest.on{transform:translateY(0)}
.rest .clock{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s3)}
.rest .t{font-size:80px;line-height:.92;letter-spacing:-.02em}
.rest .line{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:var(--s6)}
.rest .line i{display:block;height:100%;background:var(--muted);width:100%;transform-origin:left;
 transition:transform 1s linear}
.nextblock{border-top:1px solid var(--border);padding-top:var(--s5);margin-bottom:var(--s5)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;
 transition:opacity var(--d2)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--surface);
 border-top:1px solid var(--border);border-radius:20px 20px 0 0;
 padding:var(--s6) var(--g) calc(var(--safe-b) + var(--s6));transform:translateY(100%);
 transition:transform var(--d4) var(--ease-ios);max-height:82%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sum{position:absolute;inset:0;background:var(--bg);z-index:40;overflow-y:auto;
 padding:calc(var(--safe-t) + var(--s8)) var(--g) calc(var(--safe-b) + var(--s6));
 transform:translateY(100%);transition:transform var(--d4) var(--ease-ios)}
.sum.on{transform:translateY(0)}
.figs{display:flex;gap:var(--s9);margin:var(--s7) 0}
.fig .k{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);font-weight:500}
.fig .v{font-size:28px;line-height:34px;margin-top:var(--s2);letter-spacing:-.018em}
.toast{position:absolute;left:var(--g);right:var(--g);bottom:calc(var(--safe-b) + var(--s5));
 background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:var(--s3) var(--s4);
 font-size:13px;line-height:18px;color:var(--muted);z-index:50;opacity:0;transform:translateY(6px);
 transition:opacity var(--d2),transform var(--d2);pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}
.update{position:absolute;left:var(--g);right:var(--g);top:calc(var(--safe-t) + var(--s3));
 background:var(--surface);border:1px solid var(--border);border-radius:12px;
 padding:var(--s3) var(--s4);z-index:60;display:none;align-items:center;justify-content:space-between;
 gap:var(--s4);font-size:13px;line-height:18px;color:var(--muted)}
.update.on{display:flex}
.update button{color:var(--accent);font-size:13px;font-weight:600;flex-shrink:0;min-height:32px;
 display:flex;align-items:center}
.empty{color:var(--subtle);font-size:15px;line-height:20px;padding:var(--s6) 0}
.fld{margin-bottom:var(--s4)}
.fld label{display:block;font-size:13px;color:var(--subtle);margin-bottom:var(--s2);
 letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:44px;border:1px solid var(--border);border-radius:10px;
 display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.seg button.on{border-color:var(--text);color:var(--text)}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:var(--s2)}
.spark i{flex:1;background:var(--border);border-radius:1px;min-height:2px}
.spark i.hi{background:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
 .figure{transition:opacity 100ms linear!important;transform:none!important}}
</style>
</head>
<body>
<div class="app">
 <section class="page on" id="p-today"></section>
 <section class="page" id="p-plan"></section>
 <section class="page" id="p-progress"></section>
 <section class="page" id="p-gym"></section>
 <section class="page" id="p-settings"></section>

 <nav>
  <button class="on" data-t="today"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Today</span></button>
  <button data-t="plan"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg><span>Plan</span></button>
  <button data-t="progress"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8"/></svg><span>Progress</span></button>
  <button data-t="gym"><svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M9 7v10M15 7v10M9 12h6"/></svg><span>Gyms</span></button>
  <button data-t="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Settings</span></button>
 </nav>

 <div class="runner" id="runner">
  <div class="rhead"><div class="eyebrow" id="rTitle">Session</div>
   <button class="meta" id="quit" style="min-height:44px;display:flex;align-items:center">End</button></div>
  <div class="rex"><h1 id="exName"></h1><div class="where" id="exWhere"></div>
   <div class="ticks" id="ticks"></div></div>
  <div class="hero">
   <div class="figure" id="figure"><span class="v n" id="wt">0</span><span class="u" id="unit">kg</span></div>
   <div class="target">target <span class="n" id="reps">0</span> reps</div>
   <div class="note" id="note"></div><div class="loadline" id="loadline"></div>
   <div class="lastline" id="lastline"></div>
  </div>
  <div class="rctl">
   <div class="nudge"><button id="minus" aria-label="Decrease">−</button>
    <span class="inc" id="incLbl"></span><button id="plus" aria-label="Increase">+</button></div>
   <button class="btn" id="confirm">Done</button>
   <div class="secondary"><button id="swap">Swap</button><button id="missed">Missed reps</button></div>
   <div class="upnextline" id="upnext"></div>
  </div>
  <div class="rest" id="rest">
   <div class="eyebrow">Rest</div>
   <div class="clock"><div class="t n" id="clock">0:00</div><div class="line"><i id="line"></i></div></div>
   <div class="nextblock"><div class="eyebrow">Next</div>
    <div style="margin-top:var(--s2)" id="nextV"></div>
    <div class="n" style="margin-top:var(--s1)" id="nextN"></div></div>
   <button class="btn" id="skipRest">Start set</button>
  </div>
 </div>

 <div class="scrim" id="scrim"></div>
 <div class="sheet" id="sheet"></div>
 <div class="sum" id="sum"></div>
 <div class="toast" id="toast"></div>
 <div class="update" id="update"><span>New version ready</span>
  <button id="doUpdate">Reload</button></div>
</div>

<script>
/* ════ storage ════════════════════════════════════════ */
const KEY='barbell.v1';
let D=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Could not save — storage full?')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

function seed(){
 const m=(gym,brand,name,kind,inc)=>({id:uid(),gym,brand,name,kind,inc});
 const g1=uid(),g2=uid();
 const M=[
  m(g1,'Eleiko','Barbell','bar',2.5), m(g1,'Dumbbells','Dumbbells','db',2),
  m(g1,'Hammer Strength','Iso-Lateral Row','stack',5),
  m(g1,'Hammer Strength','Shoulder Press','stack',5),
  m(g1,'Matrix','Cable station','stack',2.5), m(g1,'Matrix','Lat Pulldown','stack',5),
  m(g1,'Life Fitness','Chest Press','stack',5), m(g1,'Prime','RS Row','stack',5),
  m(g2,'Home','Adjustable dumbbells','db',2),
 ];
 const ex=(mId,name,pat)=>({id:uid(),machine:mId,name,pattern:pat});
 const E=[
  ex(M[0].id,'Barbell Bench Press','h-push'), ex(M[0].id,'Barbell Row','h-pull'),
  ex(M[0].id,'Overhead Press','v-push'), ex(M[0].id,'Back Squat','squat'),
  ex(M[1].id,'Incline DB Press','h-push'), ex(M[1].id,'DB Lateral Raise','lat'),
  ex(M[2].id,'Iso-Lateral Row','h-pull'), ex(M[3].id,'Machine Shoulder Press','v-push'),
  ex(M[4].id,'Cable Lateral Raise','lat'), ex(M[4].id,'Triceps Pushdown','arm'),
  ex(M[5].id,'Lat Pulldown','v-pull'), ex(M[6].id,'Machine Chest Press','h-push'),
  ex(M[7].id,'Chest-Supported Row','h-pull'),
 ];
 const it=(exId,sets,lo,hi,seedWt,rest)=>({id:uid(),ex:exId,sets,lo,hi,seed:seedWt,rest});
 const S=[
  {id:uid(),name:'Push A',items:[it(E[0].id,3,6,8,60,150),it(E[4].id,3,8,10,24,120),
    it(E[7].id,3,8,10,40,120),it(E[8].id,4,12,15,9,60)]},
  {id:uid(),name:'Pull A',items:[it(E[6].id,3,8,10,70,120),it(E[10].id,3,8,10,50,120),
    it(E[12].id,3,10,12,45,90),it(E[1].id,3,6,8,50,120)]},
  {id:uid(),name:'Legs A',items:[it(E[3].id,4,5,8,70,180)]},
  {id:uid(),name:'Push B',items:[it(E[2].id,4,5,8,35,150),it(E[11].id,3,8,12,45,90),
    it(E[5].id,4,12,15,8,60),it(E[9].id,3,10,12,25,60)]},
 ];
 return {v:1,settings:{unit:'kg',rest:120,round:2.5},
  gyms:[{id:g1,name:'Main gym'},{id:g2,name:'Home'}],activeGym:g1,
  machines:M,exercises:E,sessions:S,order:S.map(s=>s.id),nextIdx:0,history:[]};
}
function load(){
 try{const r=localStorage.getItem(KEY); D=r?JSON.parse(r):seed()}catch(e){D=seed()}
 if(!D||!D.v)D=seed(); save();
}
/* ════ helpers ════════════════════════════════════════ */
const mach=id=>D.machines.find(m=>m.id===id);
const exr=id=>D.exercises.find(e=>e.id===id);
const gym=id=>D.gyms.find(g=>g.id===id);
const sess=id=>D.sessions.find(s=>s.id===id);
const U=()=>D.settings.unit;
const fmt=v=>Number.isInteger(v)?String(v):String(+v.toFixed(2));
const roundTo=(v,inc)=>Math.max(0,Math.round(v/inc)*inc);
/* Deload: nearest step to −10%, but guaranteed at least one step below current.
   Flooring over-corrects on coarse machines (11kg on 2.5 steps would drop 32%). */
const deload=(cur,inc)=>{let d=roundTo(cur*0.9,inc);if(d>=cur)d=cur-inc;return Math.max(inc,d)};

function pastFor(exId){
 return D.history.filter(h=>h.entries.some(e=>e.ex===exId))
  .sort((a,b)=>b.date.localeCompare(a.date))
  .map(h=>({date:h.date,entry:h.entries.find(e=>e.ex===exId)}));
}
/* the progression rule — deterministic, explainable */
function target(item){
 const p=pastFor(item.ex), inc=mach(exr(item.ex).machine).inc;
 if(!p.length) return {wt:item.seed,why:'starting weight'};
 const last=p[0], lw=last.entry.sets[0]?.wt ?? item.seed;
 const gap=days(last.date,today());
 if(gap>14) return {wt:deload(lw,inc),why:`${gap} days off — stepped back`};
 const hitAll=last.entry.sets.length>=item.sets && last.entry.sets.every(s=>s.ok&&s.reps>=item.hi);
 if(hitAll) return {wt:roundTo(lw+inc,inc),why:`up ${fmt(inc)} — all sets at ${item.hi}`};
 const missedLast=s=>s.sets.some(x=>!x.ok);
 if(p.length>1 && missedLast(last.entry) && missedLast(p[1].entry))
  return {wt:deload(lw,inc),why:'missed twice — down 10%'};
 return {wt:lw,why:'holding — last session incomplete'};
}
function lastLine(exId){
 const p=pastFor(exId); if(!p.length)return '';
 const s=p[0].entry.sets; if(!s.length)return '';

 // week strip

 let strip='';
 for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);

  return a!=null&&b!=null&&b!==a?{name:e.name,from:a,to:b,n:p.length}:null}).filter(Boolean).slice(0,3);

   <div class="sub" style="margin-top:var(--s1)">${esc(gym(D.activeGym).name)} · session ${D.history.length+1}</div></header>
  <div class="card"><div class="top"><div class="h-md">Today's session</div>

   <div class="plist">${items}</div>
   <button class="btn" onclick="startSession('${s.id}')">Start session</button></div>

function loadline(c){
 if(c.m.kind==='bar'){const s=(c.wt-20)/2;if(s<=0)return'empty bar';
  const P=[25,20,15,10,5,2.5,1.25],out=[];let r=s;
  P.forEach(w=>{while(r>=w-.001){out.push(fmt(w));r=+(r-w).toFixed(2)}});
  return r>0.01?'≈ '+out.join(' + ')+' per side':out.join(' + ')+'  per side'}
 if(c.m.kind==='db')return fmt(c.wt)+' each hand';
 return 'pin at '+fmt(c.wt);
}
function paint(anim){
 const c=R_cur(),f=$('figure'),it=c.item;
 const go=()=>{
  $('exName').textContent=c.ex.name;
  $('exWhere').textContent=`${c.m.brand} ${c.m.name} · ${gym(c.m.gym).name}`;
  $('wt').textContent=fmt(c.wt); $('unit').textContent=U();
  $('reps').textContent=`${it.lo}–${it.hi}`;
  $('incLbl').textContent=fmt(c.m.inc)+' '+U()+' steps';
  $('loadline').textContent=loadline(c);
  $('note').textContent=c.why;
  $('lastline').innerHTML=c.hist?`<span>last time</span><span class="n">${c.hist}</span>`:'<span>first time on this machine</span>';
  let h='';for(let i=0;i<it.sets;i++){const v=c.logged[i];
   h+=`<span class="tick ${v?(v.ok?'done':'miss'):(i===R.set?'now':'')}"></span>`}
  $('ticks').innerHTML=h+`<span class="ticklbl">set <span class="n">${Math.min(R.set+1,it.sets)}</span> of <span class="n">${it.sets}</span></span>`;
  const rest=R.items.slice(R.ix+1).map(x=>x.ex.name);
  $('upnext').textContent=rest.length?'Then: '+rest.join(' · '):'Last lift of the session';
 };
 if(anim){f.classList.add('swap');setTimeout(()=>{go();f.classList.remove('swap')},180)}else go();
}
function advance(ok){
 const c=R_cur(),it=c.item;
 c.logged[R.set]={wt:c.wt,reps:ok?it.hi:it.lo,ok};
 R.set++;
 if(R.set>=it.sets){
  if(R.ix>=R.items.length-1){paint();return finish()}
  R.ix++;R.set=0;paint(true);
 }else paint();
 startRest(it.rest||D.settings.rest);
}
function startRest(sec){
 const c=R_cur();
 $('nextV').textContent=`${c.ex.name} · set ${R.set+1}`;
 $('nextN').textContent=`${fmt(c.wt)} ${U()} × ${c.item.lo}–${c.item.hi}`;
 $('rest').classList.add('on');
 let left=sec;
 const tick=()=>{$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('line').style.transform='scaleX('+(left/sec)+')';
  if(left<=0)return endRest(); left--};
 tick();clearInterval(timer);timer=setInterval(tick,1000);
}
function endRest(){clearInterval(timer);$('rest').classList.remove('on')}
function finish(){
 endRest();
 const entries=R.items.filter(c=>c.logged.length)
   .map(c=>({ex:c.ex.id,sets:c.logged.filter(Boolean)}));
 if(!entries.length){$('runner').classList.remove('on');R=null;return renderAll()}
 const sets=entries.reduce((a,e)=>a+e.sets.length,0);
 const volume=Math.round(entries.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.wt*s.reps,0),0));
 const mins=Math.max(1,Math.round((Date.now()-R.t0)/60000));
 const rec={id:uid(),date:today(),session:R.sid,entries,sets,volume,mins};
 D.history.push(rec);
 D.nextIdx=(D.order.indexOf(R.sid)+1)%D.order.length;
 save();
 const rows=R.items.map(c=>{
  const prev=pastFor(c.ex.id)[1];
  const pw=prev?prev.entry.sets[0]?.wt:null;
  const d=pw!=null?+(c.wt-pw).toFixed(2):null;
  return`<div class="row"><div class="l"><div class="t">${esc(c.ex.name)}</div>
   <div class="s">${esc(c.m.brand)} ${esc(c.m.name)}</div></div>
   <div class="r"><span class="n">${fmt(c.wt)}</span> ${U()}
   <div class="d">${d==null?'first time':d>0?'↑ '+fmt(d):d===0?'held':'↓ '+fmt(-d)}</div></div></div>`}).join('');
 const next=R.items.map(c=>{const t=target(c.item);
  return`<div class="row"><div class="l"><div class="t">${esc(c.ex.name)}</div>
   <div class="s">${t.why}</div></div>
   <div class="r"><span class="n">${fmt(t.wt)}</span> ${U()}</div></div>`}).join('');
 $('sum').innerHTML=`<h2 class="h-lg">${esc(sess(R.sid).name)}</h2>
  <div class="sub" style="margin-top:var(--s1)">${mins} min · ${R.items.length} lifts · ${today()}</div>
  <div class="figs"><div class="fig"><div class="k">Volume</div>
    <div class="v n">${volume.toLocaleString()}</div></div>
   <div class="fig"><div class="k">Sets</div><div class="v n">${sets}</div></div></div>
  <div class="sect">This session</div>${rows}
  <div class="sect">Next time</div>${next}
  <button class="btn quiet" style="margin-top:var(--s8)" onclick="closeSum()">Close</button>`;
 setTimeout(()=>$('sum').classList.add('on'),450);
}
window.closeSum=()=>{$('sum').classList.remove('on');$('runner').classList.remove('on');R=null;renderAll()};
$('confirm').onclick=()=>advance(true);
$('missed').onclick=()=>{advance(false);toast('Logged. This weight repeats next session.')};
$('minus').onclick=()=>{const c=R_cur();c.wt=Math.max(0,+(c.wt-c.m.inc).toFixed(2));paint()};
$('plus').onclick=()=>{const c=R_cur();c.wt=+(c.wt+c.m.inc).toFixed(2);paint()};
$('skipRest').onclick=endRest;
$('quit').onclick=()=>finish();
$('swap').onclick=()=>{
 const c=R_cur();
 const alts=D.exercises.filter(e=>e.id!==c.ex.id&&mach(e.machine).gym===c.m.gym)
  .sort((a,b)=>(a.pattern===c.ex.pattern?-1:0)-(b.pattern===c.ex.pattern?-1:0));
 if(!alts.length)return toast('No other machines at this gym yet');
 openSheet(`<div class="h-md">Swap exercise</div>
  <div class="sub" style="margin:var(--s1) 0 var(--s6)">At ${esc(gym(c.m.gym).name)} · same pattern first</div>
  ${alts.map(e=>{const m=mach(e.machine);
   return`<button class="row" onclick="doSwap('${e.id}')"><div class="l"><div class="t">${esc(e.name)}</div>
    <div class="s">${esc(m.brand)} ${esc(m.name)}${e.pattern===c.ex.pattern?' · same pattern':''}</div></div>
    <div class="chev">›</div></button>`}).join('')}`)};
window.doSwap=exId=>{const c=R_cur(),e=exr(exId),m=mach(e.machine);
 c.ex=e;c.m=m;c.hist=lastLine(exId);
 const p=pastFor(exId);
 c.wt=p.length?p[0].entry.sets[0].wt:roundTo(c.wt,m.inc);
 c.why=p.length?'from your history on this machine':'first time on this machine';
 closeSheet();paint(true);toast('Swapped. This machine keeps its own history.')};

/* ════ service worker + updates ═══════════════════════ */
const BUILD='2026-08-05a';
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').then(reg=>{
   // A waiting worker means a new version is installed but held back
   // deliberately, so it can never swap in mid-session.
   const offer=w=>{if(!w)return;$('update').classList.add('on');
     $('doUpdate').onclick=()=>{w.postMessage('skip');$('update').classList.remove('on')}};
   if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
   reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
     w.addEventListener('statechange',()=>{
       if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
   // Check for a new build whenever the app is brought back to the front
   document.addEventListener('visibilitychange',()=>{
     if(document.visibilityState==='visible'&&!R)reg.update().catch(()=>{})});
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;reloading=true;location.reload()});
 });
}
/* Ask the browser to treat this origin's data as persistent. Not a
   guarantee, but it markedly reduces the odds of eviction. */
if(navigator.storage&&navigator.storage.persist){
 navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{})}).catch(()=>{});
}

/* ════ boot ═══════════════════════════════════════════ */
function renderAll(){renderToday();renderPlan();renderProgress();renderGym();renderSettings()}
load();renderAll();
</script>
